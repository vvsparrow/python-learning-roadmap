[project]
name = "python-learning-roadmap"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "rich>=15.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.22",
]

[tool.ruff]
preview = true
line-length = 88
lint.select = ["E", "F", "W", "I", "E303"]
lint.ignore = ["E501"]
extend-include = ["*.md"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
