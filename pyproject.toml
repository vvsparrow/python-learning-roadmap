[project]
name = "python-learning-roadmap"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "packaging>=26.3",
    "pillow>=12.3.0",
    "requests>=2.34.2",
    "rich>=15.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.22",
]

[tool.ruff]
preview = true
target-version = "py312"
line-length = 88

lint.select = ["E", "F", "W", "I", "B", "UP", "PT", "SIM",]
lint.ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
